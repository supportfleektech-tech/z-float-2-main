[phases.setup]
nixPkgs = ["nodejs", "corepack"]

[phases.install]
cmds = [
  "corepack enable pnpm",
  "pnpm install --frozen-lockfile",
]

[phases.build]
# Workspace packages must be built first (two passes: the workspace has
# dependency cycles, e.g. database <-> payments-core). Mirrors railway.json.
cmds = [
  "cd ../.. && (pnpm -r --no-bail --filter './packages/*' build || true)",
  "cd ../.. && pnpm -r --filter './packages/*' build",
  "cd ../.. && pnpm --filter @zfloat/worker build",
]

[phases.deploy]
cmd = "pnpm --filter @zfloat/worker start"