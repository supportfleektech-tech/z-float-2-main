<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif"><rect width="1280" height="700" fill="#F6F8FC"/><text x="24" y="32" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" fill="#0F1B33" font-weight="800" text-anchor="start">Wallet &amp; ledger architecture — double-entry with an append-only per-wallet ledger</text><text x="24" y="52" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#51617C" font-weight="400" text-anchor="start">Every funding / reserve / release / apply — and every denied double-spend attempt — is recorded with a balance-after == wallet-state guard.</text><defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F5BFF"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1B33"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F4E"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C73B3B"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><rect x="24" y="92" width="330" height="500" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="38" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Money commands (services)</text><rect x="40" y="150" width="298" height="64" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="56" cy="170" r="5" fill="#0E9F4E"/><text x="68" y="171" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.8" fill="#0F1B33" font-weight="600" text-anchor="start">fundWallet · payment-link collect</text><text x="68" y="192" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">FUND entry + funding journal</text><rect x="40" y="234" width="298" height="64" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="56" cy="254" r="5" fill="#0F5BFF"/><text x="68" y="255" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.8" fill="#0F1B33" font-weight="600" text-anchor="start">reserveFunds (submit / queue)</text><text x="68" y="276" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">RESERVE — denied attempts audited too</text><rect x="40" y="318" width="298" height="64" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="56" cy="338" r="5" fill="#0E7490"/><text x="68" y="339" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.8" fill="#0F1B33" font-weight="600" text-anchor="start">applyFunds (execution)</text><text x="68" y="360" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">APPLY — principal leaves the wallet</text><rect x="40" y="402" width="298" height="64" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="56" cy="422" r="5" fill="#A16207"/><text x="68" y="423" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.8" fill="#0F1B33" font-weight="600" text-anchor="start">releaseFunds (cancel / fail)</text><text x="68" y="444" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">RELEASE</text><rect x="40" y="486" width="298" height="64" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="56" cy="506" r="5" fill="#C73B3B"/><text x="68" y="507" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.8" fill="#0F1B33" font-weight="600" text-anchor="start">postReversalJournal (approved reversal)</text><text x="68" y="528" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">compensating credit back to wallet</text><rect x="386" y="92" width="470" height="500" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="400" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Ledger core (Postgres)</text><rect x="402" y="150" width="438" height="92" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="413" y="170" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F1B33" font-weight="600" text-anchor="start">journals + journal_entries</text><text x="413" y="183" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">double-entry: every journal balances to net zero; entries carry</text><text x="413" y="195" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">debits/credits against chart accounts; fee &amp; provider snapshots</text><text x="413" y="207" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">are immutable per payment</text><rect x="402" y="264" width="438" height="70" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="413" y="284" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F1B33" font-weight="600" text-anchor="start">chart_of_accounts (ensureSystemChart)</text><text x="413" y="297" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">tenant system chart: cash / wallet, fee income, payables, suspense</text><rect x="402" y="356" width="438" height="70" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="413" y="376" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F1B33" font-weight="600" text-anchor="start">wallets</text><text x="413" y="389" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">availableMinor + reservedMinor; serialized by row lock (atomic)</text><rect x="402" y="448" width="438" height="106" rx="9" fill="#E2F3F7" stroke="#B5DEE7" stroke-width="1.2"/><text x="413" y="468" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0E7490" font-weight="600" text-anchor="start">wallet_ledger_entries (migration 011)</text><text x="413" y="481" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">append-only audit rail — DB trigger forbids UPDATE/DELETE;</text><text x="413" y="493" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">per-type delta semantics; balance_after == wallet state guard;</text><text x="413" y="505" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">survives failed commands (denied attempts written in own tx)</text><rect x="888" y="92" width="368" height="500" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="902" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Consumers &amp; integrity</text><rect x="904" y="150" width="336" height="92" rx="9" fill="white" stroke="#C9D3E3"/><text x="916" y="170" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0E7490" font-weight="700" text-anchor="start">Ledger health job (worker)</text><text x="916" y="188" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">per-journal balance + net-zero check every 10</text><text x="916" y="200" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">min;
imbalance → ledger.health.imbalance audit event</text><rect x="904" y="260" width="336" height="92" rx="9" fill="white" stroke="#C9D3E3"/><text x="916" y="280" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F5BFF" font-weight="700" text-anchor="start">Ledger API + portal</text><text x="916" y="298" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">listWalletLedgerEntries · countDeniedReservations
(per</text><text x="916" y="310" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">wallet — portal + compliance evidence)</text><rect x="904" y="370" width="336" height="92" rx="9" fill="white" stroke="#C9D3E3"/><text x="916" y="390" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#A16207" font-weight="700" text-anchor="start">Reconciliation</text><text x="916" y="408" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">statement import matches settled payments and
provider</text><text x="916" y="420" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">references</text><rect x="904" y="480" width="336" height="92" rx="9" fill="white" stroke="#C9D3E3"/><text x="916" y="500" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0E9F4E" font-weight="700" text-anchor="start">Compliance evidence</text><text x="916" y="518" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">pnpm evidence archives ledger + wallet-ledger rows
with</text><text x="916" y="530" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">a SHA-256 manifest</text><line x1="338" y1="182" x2="402" y2="182" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="338" y1="266" x2="402" y2="266" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="338" y1="350" x2="402" y2="350" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="338" y1="434" x2="402" y2="434" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="338" y1="518" x2="402" y2="518" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="856" y1="200" x2="904" y2="190" stroke="#0E7490" stroke-width="1.6" marker-end="url(#m-teal)"/><line x1="856" y1="320" x2="904" y2="300" stroke="#0F5BFF" stroke-width="1.6" marker-end="url(#m-blue)"/><line x1="856" y1="420" x2="904" y2="410" stroke="#A16207" stroke-width="1.6" marker-end="url(#m-amber)"/><line x1="856" y1="520" x2="904" y2="510" stroke="#0E9F4E" stroke-width="1.6" marker-end="url(#m-green)"/><line x1="24" y1="666" x2="1256" y2="666" stroke="#C9D3E3"/><text x="24" y="678" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8A97AC" font-weight="400" text-anchor="start">Parallel funding: reservations serialize on the wallet row — exactly one concurrent winner; every denied attempt is still recorded (auditable, replayable).</text></svg>