<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif"><rect width="1280" height="760" fill="#F6F8FC"/><text x="24" y="32" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" fill="#0F1B33" font-weight="800" text-anchor="start">Outbox → queues → worker</text><text x="24" y="52" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#51617C" font-weight="400" text-anchor="start">Events are committed in the same transaction as the state change; a poller (worker + optional relay) dispatches them once under a Postgres advisory-xact-lock lease.</text><defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F5BFF"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1B33"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F4E"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C73B3B"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><rect x="24" y="92" width="316" height="400" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="38" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Domain commands (one tx)</text><rect x="40" y="150" width="284" height="50" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="181" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">submitPayment · executePayment</text><rect x="40" y="216" width="284" height="50" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="247" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">requestReversal / reversal approval</text><rect x="40" y="282" width="284" height="50" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="313" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">registerBeneficiary · activation</text><rect x="40" y="348" width="284" height="50" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="379" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">batch submit / approve · fund wallet</text><rect x="40" y="414" width="284" height="50" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="445" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">payment-link collect · invite approvals</text><rect x="372" y="104" width="320" height="108" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="383" y="124" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="start">outbox_events (append-only)</text><text x="383" y="137" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">eventType · aggregateType/id · tenantId · payload</text><text x="383" y="149" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">jsonb · created_at — inserted in the SAME tx as</text><text x="383" y="161" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">the state change (no dual-write window)</text><rect x="372" y="250" width="320" height="88" rx="9" fill="#E2F3F7" stroke="#B5DEE7" stroke-width="1.2"/><text x="383" y="270" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0E7490" font-weight="600" text-anchor="start">Poller tick (5 s)</text><text x="383" y="283" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">worker (embedded) + outbox-relay standalone</text><text x="383" y="295" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">pg_try_advisory_xact_lock → exactly-one</text><text x="383" y="307" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">dispatcher per tick</text><rect x="372" y="372" width="320" height="84" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="383" y="392" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="start">dispatchOutboxTick</text><text x="383" y="405" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">marks rows published in the same tx;</text><text x="383" y="417" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">per-event handleOutboxEvent — any failure</text><text x="383" y="429" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">to a queue job with retries</text><line x1="340" y1="250" x2="372" y2="180" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><text x="352" y="226" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">enqueueOutbox(tx)</text><line x1="532" y1="212" x2="532" y2="250" stroke="#0E7490" stroke-width="1.8" marker-end="url(#m-teal)"/><line x1="532" y1="338" x2="532" y2="372" stroke="#0E7490" stroke-width="1.8" marker-end="url(#m-teal)"/><rect x="724" y="92" width="532" height="224" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="738" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Events emitted (fanout + notify + batch sync)</text><rect x="740" y="130" width="500" height="32" rx="6" fill="#F6F8FC" stroke="#C9D3E3"/><text x="752" y="150" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#0E9F4E" font-weight="600" text-anchor="start">payment.succeeded · payment.failed · payment.reversed · payment.queued</text><rect x="740" y="170" width="500" height="32" rx="6" fill="#F6F8FC" stroke="#C9D3E3"/><text x="752" y="190" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#6D28D9" font-weight="600" text-anchor="start">payment.approval_requested</text><rect x="740" y="210" width="500" height="32" rx="6" fill="#F6F8FC" stroke="#C9D3E3"/><text x="752" y="230" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#0F5BFF" font-weight="600" text-anchor="start">batch.approved · batch.submitted · batch.validated</text><rect x="740" y="250" width="500" height="32" rx="6" fill="#F6F8FC" stroke="#C9D3E3"/><text x="752" y="270" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#A16207" font-weight="600" text-anchor="start">beneficiary.activated · registration_requested · rejected</text><rect x="740" y="290" width="500" height="32" rx="6" fill="#F6F8FC" stroke="#C9D3E3"/><text x="752" y="310" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#0E7490" font-weight="600" text-anchor="start">balance.funded (wallet funding / payment-link collect)</text><rect x="724" y="340" width="532" height="200" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="738" y="364" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">BullMQ queues consumed by the worker (10)</text><rect x="740" y="392" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="799.0" y="410.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">payments.execution</text><rect x="868" y="392" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="927.0" y="410.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">batches.execution</text><rect x="996" y="392" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1055.0" y="410.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">webhooks.process</text><rect x="1124" y="392" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1183.0" y="410.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">webhooks.deliver</text><rect x="740" y="456" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="799.0" y="474.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">notifications.send</text><rect x="868" y="456" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="927.0" y="474.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">payments.monitor</text><rect x="996" y="456" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1055.0" y="474.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">schedules.dispatch</text><rect x="1124" y="456" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1183.0" y="474.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">reconciliation.run</text><rect x="740" y="520" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="799.0" y="538.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">files.scan</text><rect x="868" y="520" width="118" height="30" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="927.0" y="538.15" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#0E7490" font-weight="600" text-anchor="middle">reports.generate</text><rect x="724" y="568" width="532" height="110" rx="9" fill="#E6F7EE" stroke="#BCE5CC" stroke-width="1.2"/><text x="735" y="588" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0E9F4E" font-weight="600" text-anchor="start">Fan-out &amp; delivery</text><text x="735" y="601" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">notifications.send → in-app · email (SMTP / sink / console) · SMS (AT-compatible HTTP)</text><text x="735" y="612.6" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">fanoutWebhookDeliveries → tenant subscriptions · HMAC-SHA256 x-zfloat-signature over</text><text x="735" y="624.2" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">the exact bytes · delivery log · retries 2s→30s × 5 · batch row sync (markBatchRowOutcome)</text><line x1="692" y1="250" x2="724" y2="260" stroke="#0E7490" stroke-width="2" marker-end="url(#m-teal)"/><text x="706" y="240" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">publish</text><path d="M692,400 C710,440 710,470 724,560" fill="none" stroke="#0E7490" stroke-width="1.8" marker-end="url(#m-teal)"/><text x="700" y="470" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">jobs</text><line x1="692" y1="180" x2="724" y2="180" stroke="#0E7490" stroke-width="2" marker-end="url(#m-teal)"/><text x="702" y="170" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">events</text><line x1="24" y1="726" x2="1256" y2="726" stroke="#C9D3E3"/><text x="24" y="738" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8A97AC" font-weight="400" text-anchor="start">Guarantees: same-tx write → no event loss on crash · lease arbitration → exactly-one dispatch · queue retries absorb transient failure.</text></svg>