<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif"><rect width="1280" height="800" fill="#F6F8FC"/><text x="24" y="32" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" fill="#0F1B33" font-weight="800" text-anchor="start">Approval engine — request lifecycle &amp; decision path</text><text x="24" y="52" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#51617C" font-weight="400" text-anchor="start">createApprovalRequest (maker side) · recordApprovalAction (checker side) · dispatch on APPROVED · expireDueApprovals (worker cron)</text><defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F5BFF"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1B33"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F4E"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C73B3B"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><line x1="110" y1="128" x2="110" y2="470" stroke="#C9D3E3" stroke-width="1.6"/><rect x="61.2" y="88" width="97.6" height="24" rx="12" fill="#F6F8FC" stroke="#C9D3E3"/><text x="110" y="104" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="700" text-anchor="middle">Maker portal</text><circle cx="110" cy="122" r="3.5" fill="#0F5BFF"/><line x1="330" y1="128" x2="330" y2="470" stroke="#C9D3E3" stroke-width="1.6"/><rect x="256.0" y="88" width="148.0" height="24" rx="12" fill="#F6F8FC" stroke="#C9D3E3"/><text x="330" y="104" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="700" text-anchor="middle">Submit routes · gate</text><circle cx="330" cy="122" r="3.5" fill="#0F5BFF"/><line x1="610" y1="128" x2="610" y2="470" stroke="#C9D3E3" stroke-width="1.6"/><rect x="532.85" y="88" width="154.29999999999998" height="24" rx="12" fill="#F6F8FC" stroke="#C9D3E3"/><text x="610" y="104" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="700" text-anchor="middle">Approvals engine (tx)</text><circle cx="610" cy="122" r="3.5" fill="#0F5BFF"/><line x1="920" y1="128" x2="920" y2="470" stroke="#C9D3E3" stroke-width="1.6"/><rect x="846.0" y="88" width="148.0" height="24" rx="12" fill="#F6F8FC" stroke="#C9D3E3"/><text x="920" y="104" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="700" text-anchor="middle">Checker · center API</text><circle cx="920" cy="122" r="3.5" fill="#0F5BFF"/><line x1="1150" y1="128" x2="1150" y2="470" stroke="#C9D3E3" stroke-width="1.6"/><rect x="1082.3" y="88" width="135.39999999999998" height="24" rx="12" fill="#F6F8FC" stroke="#C9D3E3"/><text x="1150" y="104" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="700" text-anchor="middle">Dispatch executors</text><circle cx="1150" cy="122" r="3.5" fill="#0F5BFF"/><path d="M110,170 L330,170" stroke="#0F5BFF" stroke-width="1.7" marker-end="url(#m-blue)"/><text x="220.0" y="155.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0F5BFF" font-weight="600" text-anchor="middle">① submit payment / batch / payee</text><text x="220.0" y="166.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0F5BFF" font-weight="600" text-anchor="middle">/ reversal / privileged invite</text><path d="M330,210 L610,210" stroke="#0E7490" stroke-width="1.7" marker-end="url(#m-teal)"/><text x="470.0" y="190.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E7490" font-weight="600" text-anchor="middle">② resolve ACTIVE policy →</text><text x="470.0" y="201.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E7490" font-weight="600" text-anchor="middle">createApprovalRequest (PENDING + immutable</text><text x="470.0" y="212.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E7490" font-weight="600" text-anchor="middle">snapshot + steps)</text><path d="M610,250 L330,250" stroke="#6D28D9" stroke-width="1.7" marker-end="url(#m-purple)"/><text x="470.0" y="241.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#6D28D9" font-weight="600" text-anchor="middle">③ resource marked PENDING — not executable</text><path d="M920,310 L610,310" stroke="#0E9F4E" stroke-width="1.7" marker-end="url(#m-green)"/><text x="765.0" y="301.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E9F4E" font-weight="600" text-anchor="middle">④ decision approve | reject (+comment)</text><path d="M610,350 L920,350" stroke="#0E9F4E" stroke-width="1.7" marker-end="url(#m-green)"/><text x="765.0" y="335.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E9F4E" font-weight="600" text-anchor="middle">⑤ PARTIALLY_APPROVED (next level) / APPROVED /</text><text x="765.0" y="346.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0E9F4E" font-weight="600" text-anchor="middle">REJECTED</text><path d="M920,390 L330,390" stroke="#C73B3B" stroke-width="1.7" marker-end="url(#m-red)"/><text x="625.0" y="381.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#C73B3B" font-weight="600" text-anchor="middle">⑥ REJECTED side-effects: payee / invite / payment rejected (payment amendable)</text><path d="M330,440 L1150,440" stroke="#0F5BFF" stroke-width="1.7" marker-end="url(#m-blue)"/><text x="740.0" y="431.0" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.4" fill="#0F5BFF" font-weight="600" text-anchor="middle">⑦ APPROVED → dispatch executor by request kind</text><rect x="998" y="500" width="258" height="92" rx="9" fill="#EAF1FF" stroke="#AEC6F7" stroke-width="1.2"/><text x="1009" y="520" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#0F5BFF" font-weight="600" text-anchor="start">Executors</text><text x="1009" y="532" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">approveQueuedPayment · approveBatch</text><text x="1009" y="543.6" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">activateBeneficiary · executeApproved</text><text x="1009" y="555.2" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">Reversal · applyInviteRoleDecision</text><rect x="40" y="620" width="590" height="130" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="54" y="644" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#6D28D9" font-weight="700" text-anchor="start">recordApprovalAction — transaction guard checks</text><text x="54" y="666" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• request row locked FOR UPDATE; terminal state → ALREADY_RESOLVED</text><text x="54" y="683" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• creator ≠ actor and creator ≠ delegatedFor → MAKER_CHECKER_VIOLATION</text><text x="54" y="700" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• one action per actor per request → ALREADY_ACTED</text><text x="54" y="717" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• actor role must match the current level (SEQUENTIAL) or an open step</text><text x="54" y="734" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• count approvals per step vs min-approvers → escalate level or resolve</text><rect x="650" y="620" width="590" height="130" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="664" y="644" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F5BFF" font-weight="700" text-anchor="start">Lifecycle &amp; audit trail</text><text x="664" y="666" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• PENDING → PARTIALLY_APPROVED per level → APPROVED | REJECTED | EXPIRED</text><text x="664" y="683" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• EXPIRED: expireDueApprovals (worker cron) closes stale requests</text><text x="664" y="700" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• approval_requests: immutable policy + context + metadata snapshot</text><text x="664" y="717" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• approval_actions: who · when · decision · level · comment — append-only</text><text x="664" y="734" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.6" fill="#0F1B33" font-weight="400" text-anchor="start">• dispatch is idempotent — replays never double-execute</text><line x1="24" y1="762" x2="1256" y2="762" stroke="#C9D3E3"/><text x="24" y="774" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8A97AC" font-weight="400" text-anchor="start">The same engine and guarantees back all four flows in 03-maker-checker-end-to-end.svg.</text></svg>