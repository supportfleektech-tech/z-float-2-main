<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif"><rect width="1280" height="800" fill="#F6F8FC"/><text x="24" y="32" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" fill="#0F1B33" font-weight="800" text-anchor="start">Deployment topology</text><text x="24" y="52" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#51617C" font-weight="400" text-anchor="start">Docker compose: web · worker · relay · migrate on PostgreSQL + Valkey. Secrets vault applied at boot; demo vs production driver matrix.</text><defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F5BFF"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1B33"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F4E"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C73B3B"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><rect x="40" y="110" width="250" height="60" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="128" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#0F1B33" font-weight="600" text-anchor="start">Browsers</text><text x="51" y="140" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="start">portal (tenant) · admin (platform)</text><text x="51" y="151.8" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="start">marketing · public pay page</text><rect x="40" y="190" width="250" height="60" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="51" y="208" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#0F1B33" font-weight="600" text-anchor="start">Integrations</text><text x="51" y="220" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="start">REST API v1 (api keys)</text><text x="51" y="231.8" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="start">provider webhooks (HMAC + dedupe)</text><rect x="330" y="130" width="110" height="84" rx="9" fill="#EAF1FF" stroke="#AEC6F7" stroke-width="1.2"/><text x="385.0" y="167.525" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F5BFF" font-weight="600" text-anchor="middle">HTTPS / LB</text><text x="385.0" y="185.525" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.5" fill="#51617C" font-weight="400" text-anchor="middle">TLS · rate limit</text><rect x="480" y="96" width="310" height="150" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="491" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="start">apps/web — next start :3000</text><text x="491" y="129" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">App Router pages + API routes · auth / RBAC / MFA</text><text x="491" y="141" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">secrets guard (fail-closed) · serves portal + admin</text><text x="491" y="153" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">static marketing · PWA manifest + service worker</text><rect x="830" y="96" width="200" height="150" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="841" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="start">PostgreSQL</text><text x="841" y="129" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">single writer · migrations 001–013</text><text x="841" y="141" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">(apply via migrate container)</text><rect x="1050" y="96" width="190" height="150" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1061" y="116" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="start">Valkey / Redis</text><text x="1061" y="129" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">BullMQ queues · rate limits</text><text x="1061" y="141" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#51617C" font-weight="400" text-anchor="start">worker heartbeat · relay lease</text><rect x="40" y="300" width="1200" height="190" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="54" y="324" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Application services (Docker targets)</text><rect x="60" y="346" width="272" height="122" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="78" cy="368" r="6" fill="#0F5BFF"/><text x="90" y="372" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0F1B33" font-weight="700" text-anchor="start">web</text><text x="76" y="392" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.2" fill="#0F1B33" font-weight="400" text-anchor="start">next start — user + admin traffic</text><text x="76" y="412" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">build: NODE_ENV=production, DEMO_MODE=false,</text><text x="76" y="423.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">non-zero keys (RB-10)</text><rect x="352" y="346" width="272" height="122" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="370" cy="368" r="6" fill="#0F5BFF"/><text x="382" y="372" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0F1B33" font-weight="700" text-anchor="start">worker</text><text x="368" y="392" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.2" fill="#0F1B33" font-weight="400" text-anchor="start">10 BullMQ workers + housekeeping cron</text><text x="368" y="412" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">embedded outbox poller (5 s) · ledger health</text><rect x="644" y="346" width="272" height="122" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="662" cy="368" r="6" fill="#0F5BFF"/><text x="674" y="372" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0F1B33" font-weight="700" text-anchor="start">relay</text><text x="660" y="392" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.2" fill="#0F1B33" font-weight="400" text-anchor="start">standalone outbox poller (optional)</text><text x="660" y="412" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">lease arbitration with the worker — scale-out</text><text x="660" y="423.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">N relays</text><rect x="936" y="346" width="272" height="122" rx="9" fill="white" stroke="#C9D3E3"/><circle cx="954" cy="368" r="6" fill="#0F5BFF"/><text x="966" y="372" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0F1B33" font-weight="700" text-anchor="start">migrate</text><text x="952" y="392" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.2" fill="#0F1B33" font-weight="400" text-anchor="start">one-shot migrate (+ demo seed only when</text><text x="952" y="404.5" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.2" fill="#0F1B33" font-weight="400" text-anchor="start">SEED_DEMO_DATA)</text><text x="952" y="412" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="start">idempotent · run before deploy</text><line x1="320" y1="172" x2="480" y2="172" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="440" y1="200" x2="480" y2="200" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><path d="M700,300 C700,280 860,280 900,292 L900,254" fill="none" stroke="#0E7490" stroke-width="1.8" marker-end="url(#m-teal)"/><path d="M760,300 L760,346" stroke="#0F1B33" stroke-width="1.6" marker-end="url(#m-ink)"/><text x="766" y="326" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#8A97AC" font-weight="400" text-anchor="start">web + worker + relay read/write</text><rect x="40" y="526" width="1200" height="112" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="54" y="550" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">External systems — demo: local-sandbox + mock drivers · production: real credentials, fail-closed</text><rect x="60" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="71" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">M-Pesa Daraja</text><text x="71" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">B2C · STK · status · reversal</text><rect x="262" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="273" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">Bank / PSP rails</text><text x="273" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">bank-psp adapter</text><rect x="464" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="475" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">Email (SMTP/SES) · SMS</text><text x="475" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">Africa's Talking-compatible HTTP</text><rect x="666" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="677" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">Object storage</text><text x="677" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">local | S3 (KYC · reports)</text><rect x="868" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="879" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">ClamAV</text><text x="879" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">malware scan (files.scan)</text><rect x="1070" y="572" width="186" height="54" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="1081" y="592" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#0F1B33" font-weight="600" text-anchor="start">AWS KMS</text><text x="1081" y="602" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.2" fill="#51617C" font-weight="400" text-anchor="start">secret envelopes (SECRETS_DRIVER)</text><rect x="40" y="660" width="1200" height="102" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="54" y="684" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Environment posture</text><text x="56" y="702" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#0F1B33" font-weight="400" text-anchor="start">Demo/dev: DEMO_MODE=true · built-in KES 10,000 approval threshold · seeded demo tenant · local-sandbox provider · dev-only credentials in seed</text><text x="56" y="718" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10" fill="#C73B3B" font-weight="400" text-anchor="start">Production: DEMO_MODE=false · SEED_DEMO_DATA=false · COOKIE_SECURE=true · ACTIVE tenant approval policy (APPROVAL_POLICY_REQUIRED) · non-zero ENCRYPTION_KEY/SESSION_SECRET · KMS vault</text><text x="56" y="736" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#8A97AC" font-weight="400" text-anchor="start">Env guards in packages/config are strict under NODE_ENV=production/staging — see docs/runbooks.md RB-10 and docs/production-checklist.md.</text></svg>