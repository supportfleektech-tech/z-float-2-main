<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif"><rect width="1280" height="900" fill="#F6F8FC"/><text x="24" y="32" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="19" fill="#0F1B33" font-weight="800" text-anchor="start">Payment state machine — the only legal transitions</text><text x="24" y="52" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11" fill="#51617C" font-weight="400" text-anchor="start">Every transition is a guarded server-side command: row lock (FOR UPDATE) + optimistic version + immutable status history. No provider response jumps states.</text><defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F5BFF"/></marker><marker id="m-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F1B33"/></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E9F4E"/></marker><marker id="m-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C73B3B"/></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A16207"/></marker><marker id="m-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><rect x="40" y="150" width="128" height="88" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="104.0" y="189.57500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F1B33" font-weight="600" text-anchor="middle">DRAFT</text><text x="104.0" y="207.47500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">created · fee + beneficiary snapshot</text><rect x="194" y="150" width="128" height="88" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="258.0" y="189.57500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F1B33" font-weight="600" text-anchor="middle">VALIDATING</text><text x="258.0" y="207.47500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">AML screen · policy evaluation</text><rect x="348" y="150" width="128" height="88" rx="9" fill="#F3EEFD" stroke="#C9B8EF" stroke-width="1.2"/><text x="412.0" y="184.125" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#6D28D9" font-weight="600" text-anchor="middle">PENDING_APPROVAL</text><text x="412.0" y="202.025" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">maker-checker · funds reserved,</text><text x="412.0" y="212.925" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">not sent</text><rect x="502" y="150" width="128" height="88" rx="9" fill="#F3EEFD" stroke="#C9B8EF" stroke-width="1.2"/><text x="566.0" y="189.57500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#6D28D9" font-weight="600" text-anchor="middle">APPROVED</text><text x="566.0" y="207.47500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">checker sign-off (never the maker)</text><rect x="656" y="150" width="128" height="88" rx="9" fill="#EAF1FF" stroke="#AEC6F7" stroke-width="1.2"/><text x="720.0" y="189.57500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F5BFF" font-weight="600" text-anchor="middle">QUEUED</text><text x="720.0" y="207.47500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">reservation applied · worker job</text><rect x="810" y="150" width="128" height="88" rx="9" fill="#EAF1FF" stroke="#AEC6F7" stroke-width="1.2"/><text x="874.0" y="189.57500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0F5BFF" font-weight="600" text-anchor="middle">PROCESSING</text><text x="874.0" y="207.47500000000002" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">provider attempt (attempts logged)</text><rect x="964" y="150" width="128" height="88" rx="9" fill="#FDF3E2" stroke="#E5D3A6" stroke-width="1.2"/><text x="1028.0" y="184.125" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#A16207" font-weight="600" text-anchor="middle">PROVIDER_PENDING</text><text x="1028.0" y="202.025" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">async rails — outcome via verified</text><text x="1028.0" y="212.925" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">callback or reconciliation</text><rect x="1118" y="150" width="128" height="88" rx="9" fill="#E6F7EE" stroke="#A9DCBF" stroke-width="1.2"/><text x="1182.0" y="184.125" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0E9F4E" font-weight="600" text-anchor="middle">SUCCESS</text><text x="1182.0" y="202.025" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">FINAL — verified callback or</text><text x="1182.0" y="212.925" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">reconciliation only</text><line x1="168" y1="191" x2="194" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="322" y1="191" x2="348" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="476" y1="191" x2="502" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="630" y1="191" x2="656" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="784" y1="191" x2="810" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="938" y1="191" x2="964" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><line x1="1092" y1="191" x2="1118" y2="191" stroke="#0F5BFF" stroke-width="1.8" marker-end="url(#m-blue)"/><text x="181.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">submit · validate</text><text x="335.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">policy match → request</text><text x="489.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">independent approver</text><text x="643.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">queue for execution</text><text x="797.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">payments.execution job</text><text x="951.0" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">async accepted (timeout ≠ failure)</text><text x="1074" y="264" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.4" fill="#51617C" font-weight="400" text-anchor="middle">verified outcome</text><rect x="80" y="310" width="170" height="70" rx="9" fill="#FBECEC" stroke="#EDB9B9" stroke-width="1.2"/><text x="165.0" y="340.65" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#C73B3B" font-weight="600" text-anchor="middle">REJECTED</text><text x="165.0" y="358.75" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="middle">approver rejected — terminal</text><rect x="340" y="310" width="170" height="70" rx="9" fill="#FBECEC" stroke="#EDB9B9" stroke-width="1.2"/><text x="425.0" y="340.65" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#C73B3B" font-weight="600" text-anchor="middle">FAILED</text><text x="425.0" y="358.75" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="middle">attempt / validation failure</text><rect x="600" y="310" width="170" height="70" rx="9" fill="#FFFFFF" stroke="#C9D3E3" stroke-width="1.2"/><text x="685.0" y="340.65" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12" fill="#0F1B33" font-weight="600" text-anchor="middle">CANCELLED</text><text x="685.0" y="358.75" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#51617C" font-weight="400" text-anchor="middle">maker / ops cancelled — terminal</text><text x="425" y="406" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#C73B3B" font-weight="400" text-anchor="middle">retry (bounded) → QUEUED</text><path d="M412.0,238 C412.0,278 412.0,286 412.0,310" fill="none" stroke="#C73B3B" stroke-width="1.6" marker-end="url(#m-red)"/><path d="M144.0,238 C144.0,278 144.0,287 144.0,311" fill="none" stroke="#0F1B33" stroke-width="1.6" marker-end="url(#m-ink)"/><path d="M258.0,238 C258.0,278 258.0,286 258.0,310" fill="none" stroke="#C73B3B" stroke-width="1.6" marker-end="url(#m-red)"/><path d="M720.0,238 C720.0,278 720.0,286 720.0,310" fill="none" stroke="#C73B3B" stroke-width="1.6" marker-end="url(#m-red)"/><path d="M874.0,238 C874.0,278 874.0,286 874.0,310" fill="none" stroke="#C73B3B" stroke-width="1.6" marker-end="url(#m-red)"/><text x="152.0" y="326" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#8A97AC" font-weight="400" text-anchor="start">cancel</text><text x="734.0" y="302" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#C73B3B" font-weight="400" text-anchor="start">reserve failure at queue time</text><path d="M1028.0,238 L1028.0,350" stroke="#C73B3B" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/><path d="M1028.0,238 L1028.0,420 L874.0,420 L874.0,310" stroke="#C73B3B" stroke-width="1.6" fill="none" marker-end="url(#m-red)"/><text x="1040.0" y="340" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#A16207" font-weight="400" text-anchor="start">webhook/recon verdict</text><rect x="950" y="470" width="240" height="84" rx="9" fill="#FBECEC" stroke="#EDB9B9" stroke-width="1.2"/><text x="1070.0" y="502.075" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#C73B3B" font-weight="600" text-anchor="middle">REVERSED</text><text x="1070.0" y="520.375" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="middle">checker-approved reversal · provider</text><text x="1070.0" y="531.675" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.8" fill="#51617C" font-weight="400" text-anchor="middle">reverse + compensating journal · idempotent</text><path d="M1182.0,238 C1222.0,480 980,462 950,512" fill="none" stroke="#C73B3B" stroke-width="1.8" marker-end="url(#m-red)"/><text x="1070" y="450" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9" fill="#C73B3B" font-weight="400" text-anchor="middle">maker requests reversal → approver executes</text><path d="M1108,191 C1182,430 1160,410 1160,470 L1190,490" fill="none" stroke="#C73B3B" stroke-width="1.5" marker-end="url(#m-red)"/><text x="720" y="418" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="8.6" fill="#C73B3B" font-weight="400" text-anchor="start">approved while stuck pending</text><rect x="40" y="600" width="1200" height="150" rx="9" fill="#F6F8FC" stroke="#C9D3E3" stroke-width="1.2"/><text x="54" y="624" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="13.5" fill="#0F1B33" font-weight="700" text-anchor="start">Guard rails</text><text x="56" y="658" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#51617C" font-weight="400" text-anchor="start">Transitions only via transitionPayment: state map above is the only authority — anything else throws IllegalTransitionError.</text><text x="56" y="684" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#51617C" font-weight="400" text-anchor="start">Finality: SUCCESS / FAILED / REVERSED arrive only from verified provider callbacks, monitor recovery or reconciliation — never from an HTTP request returning.</text><text x="56" y="710" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#51617C" font-weight="400" text-anchor="start">Maker-checker: above-policy or risk-flagged payments wait in PENDING_APPROVAL; sign-off is by a distinct user; actions are immutable approval_actions rows.</text><text x="56" y="736" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#51617C" font-weight="400" text-anchor="start">Outbox: transitions emit payment.succeeded / .failed / .reversed / .queued / .approval_requested in the same transaction → worker + tenant webhooks.</text><line x1="24" y1="866" x2="1256" y2="866" stroke="#C9D3E3"/><text x="24" y="878" font-family="Inter,'Segoe UI',system-ui,-apple-system,sans-serif" font-size="9.5" fill="#8A97AC" font-weight="400" text-anchor="start">Source of truth: packages/payments-core/src/state.ts (PAYMENT_STATES + TRANSITIONS).</text></svg>